<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Christian Meude — developer portfolio. Selected work, about, contact." />
    <meta name="color-scheme" content="light dark" />
    <title>Christian Meude — Developer Portfolio</title>
    <script>
      document.documentElement.classList.add('js')
      // Apply the stored theme before first paint to avoid a dark flash
      // for light-theme visitors (key must match useTheme in src/hooks/useTheme.ts).
      try {
        var storedTheme = window.localStorage.getItem('meude-theme')
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', storedTheme)
          document.documentElement.style.colorScheme = storedTheme
        }
      } catch (e) {
        /* ignore — default data-theme="dark" stands */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 4rem auto; padding: 0 1.25rem; font-family: system-ui, sans-serif; line-height: 1.6;">
        <h1>Christian Meude — Developer Portfolio</h1>
        <p>Full-stack developer — mobile, web &amp; systems. This portfolio needs JavaScript to render its project showcase.</p>
        <p>Email: <a href="mailto:christianmeude17@gmail.com">christianmeude17@gmail.com</a></p>
        <p>GitHub: <a href="https://github.com/christianmeude">github.com/christianmeude</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
